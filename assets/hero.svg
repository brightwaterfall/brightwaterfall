<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-label="brightwaterfall hero">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#0f172a;#020617" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0c4a6e">
        <animate attributeName="stop-color" values="#0c4a6e;#0369a1;#0c4a6e" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#083344">
        <animate attributeName="stop-color" values="#083344;#164e63;#083344" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="waveA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1100" height="320" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1100" height="320" fill="url(#bg)"/>

    <!-- soft orbs -->
    <circle cx="180" cy="90" r="70" fill="#22d3ee" opacity="0.12" filter="url(#glow)">
      <animate attributeName="cy" values="90;120;90" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.18;0.08" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="200" r="100" fill="#818cf8" opacity="0.14" filter="url(#glow)">
      <animate attributeName="cx" values="920;880;920" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="40" r="50" fill="#38bdf8" opacity="0.1">
      <animate attributeName="r" values="50;70;50" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- waterfall streaks -->
    <g stroke-linecap="round" opacity="0.55">
      <line x1="140" y1="-20" x2="140" y2="340" stroke="#67e8f9" stroke-width="2">
        <animate attributeName="y1" values="-20;40;-20" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="2.4s" repeatCount="indefinite"/>
      </line>
      <line x1="220" y1="-40" x2="220" y2="340" stroke="#22d3ee" stroke-width="1.5">
        <animate attributeName="y1" values="-40;20;-40" dur="3s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      </line>
      <line x1="860" y1="-30" x2="860" y2="340" stroke="#a5b4fc" stroke-width="2">
        <animate attributeName="y1" values="-30;30;-30" dur="2.7s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.65;0" dur="2.7s" begin="0.8s" repeatCount="indefinite"/>
      </line>
      <line x1="940" y1="-50" x2="940" y2="340" stroke="#38bdf8" stroke-width="1.5">
        <animate attributeName="y1" values="-50;10;-50" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- scan line -->
    <rect x="0" y="0" width="1100" height="3" fill="url(#waveA)" opacity="0.7">
      <animate attributeName="y" values="0;320;0" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- floating particles -->
    <g fill="#e0f2fe">
      <circle cx="300" cy="180" r="2.5">
        <animate attributeName="cy" values="180;120;180" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="480" cy="220" r="2">
        <animate attributeName="cy" values="220;150;220" dur="4s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="4s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="160" r="2.5">
        <animate attributeName="cy" values="160;100;160" dur="3.2s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="780" cy="240" r="1.8">
        <animate attributeName="cy" values="240;180;240" dur="4.4s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.85;0.1" dur="4.4s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- title -->
    <text x="550" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="url(#titleGrad)" filter="url(#glow)">brightwaterfall</text>
    <text x="550" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#bae6fd" opacity="0.95">Lazar · Full-Stack &amp; AI Builder</text>

    <!-- animated underline -->
    <rect x="390" y="198" width="320" height="3" rx="2" fill="#22d3ee" opacity="0.9">
      <animate attributeName="width" values="80;320;80" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x" values="510;390;510" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <text x="550" y="245" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#7dd3fc">Shipping modern web · AI tools · clean product craft</text>
  </g>

  <rect x="1.5" y="1.5" width="1097" height="317" rx="28" fill="none" stroke="#38bdf8" stroke-opacity="0.35">
    <animate attributeName="stroke-opacity" values="0.2;0.55;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
