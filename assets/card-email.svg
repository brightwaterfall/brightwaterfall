<svg xmlns="http://www.w3.org/2000/svg" width="440" height="180" viewBox="0 0 440 180" role="img" aria-label="HubSpot Email">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect width="440" height="180" rx="20" fill="url(#card)" stroke="#1e293b"/>
  <rect x="0" y="0" width="440" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" begin="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="28" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#fdba74" letter-spacing="2">FIGMA · HUBSPOT</text>
  <text x="28" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Figma ’ HubSpot Email</text>
  <text x="28" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">Design-to-code HTML emails</text>
  <text x="28" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">built for HubSpot campaigns.</text>
  <circle cx="400" cy="40" r="6" fill="#fb923c">
    <animate attributeName="r" values="4;7;4" dur="2s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
</svg>
