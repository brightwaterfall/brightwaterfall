<svg xmlns="http://www.w3.org/2000/svg" width="900" height="70" viewBox="0 0 900 70" role="img" aria-label="Stats section">
  <defs>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="70" rx="18" fill="#020617" stroke="#1e293b"/>
  <rect x="18" y="18" width="8" height="34" rx="4" fill="url(#chip)" filter="url(#soft)">
    <animate attributeName="height" values="24;34;24" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="23;18;23" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <text x="44" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#67e8f9" letter-spacing="3">SECTION</text>
  <text x="44" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">GitHub Pulse</text>
  <circle cx="850" cy="35" r="4" fill="#22d3ee">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="35" r="4" fill="#38bdf8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="890" cy="35" r="4" fill="#818cf8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
</svg>
